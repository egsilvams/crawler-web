<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Crawler Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-container">
            <h2 class="mb-4 text-center"><i class="bi bi-globe"></i> Crawler Web</h2>
            <form method="POST" onsubmit="mostrarLoading()">
                <div class="mb-3">
                    <label class="form-label">🔗 URL Inicial:</label>
                    <input type="url" class="form-control" name="url" placeholder="https://exemplo.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">⚙️ Número de Clusters (1 a 100):</label>
                    <input type="number" class="form-control" name="clusters" min="1" max="100" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-play-circle-fill"></i> Iniciar
                        Crawler</button>
                </div>
            </form>
            <div id="loading">
                <div class="spinner-border text-primary mt-4" role="status"></div>
                <p class="mt-3">⏳ Aguarde, processando...</p>
            </div>
        </div>
    </div>

    <script>
        function mostrarLoading() {
            document.querySelector('form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>

</html>
