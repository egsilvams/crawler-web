<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Resultado do Crawler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .result-box {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="result-box">
            <h2 class="text-center mb-4"><i class="bi bi-check-circle-fill text-success"></i> Resultado</h2>
            <p class="text-center">🔎 <strong>Total de URLs encontradas:</strong> {{ total }}</p>
            <ul class="list-group mb-3">
                {% for url in resultado[:10] %}
                <li class="list-group-item">{{ url }}</li>
                {% endfor %}
            </ul>
            {% if total > 10 %}
            <p class="text-center text-muted">...e mais {{ total - 10 }} URLs.</p>
            {% endif %}
            <div class="d-grid gap-2 mt-4">
                <a href="{{ url_for('download') }}" class="btn btn-outline-primary"><i class="bi bi-download"></i>
                    Baixar lista completa (.txt)</a>
                <a href="{{ url_for('index') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
            </div>
        </div>
    </div>
</body>

</html>
